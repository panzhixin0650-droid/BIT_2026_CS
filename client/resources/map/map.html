<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #eef3ec; }
  </style>
</head>
<body>
<div id="map" aria-label="充电地图，可拖动和缩放"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
"use strict";
// Shared route/station canvas. Payloads are JSON; no station text is executed.
window.bitMap = (() => {
  let map, lines, markers, bounds, autoFit = true;
  let stationMarkers, locationMarker, scene, bridge, clickFrame, pendingClick, lastStationFit;
  const state = { sdkReady: false, ready: false, tilesReady: false, error: false };
  new QWebChannel(qt.webChannelTransport, channel => {
    bridge = channel.objects.mapEvents;
    bridge.ready();
    if (state.tilesReady) bridge.tilesReady();
  });
  function fail() { state.ready = false; state.error = true; }
  function sdkLoaded() {
    state.sdkReady = true;
    state.error = false;
    return true;
  }
  function fit() {
    if (!map || !bounds) return false;
    autoFit = true;
    const padding = Math.max(12, Math.min(40, Math.min(innerWidth, innerHeight) * 0.12));
    map.fitBounds(bounds, { padding });
    return true;
  }
  function markerStyle(text, color) {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">'
      + '<circle cx="16" cy="16" r="14" fill="' + color + '" stroke="white" stroke-width="2"/>'
      + '<text x="16" y="21" text-anchor="middle" font-family="sans-serif" font-size="15" fill="white">'
      + text + '</text></svg>';
    return new TMap.MarkerStyle({ width: 32, height: 32,
      anchor: { x: 16, y: 16 }, src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) });
  }
  function stationStyle(color, selected = false, current = false) {
    const size = selected ? 40 : 34;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">'
      + '<circle cx="20" cy="21" r="19" fill="#203d33" fill-opacity=".12"/>'
      + '<circle cx="20" cy="19" r="16" fill="' + color + '" stroke="white" stroke-width="3"/>'
      + (current ? '<circle cx="20" cy="19" r="5" fill="white" fill-opacity=".35"/>'
        : '<path d="M22 8L12 22h7l-2 9 11-15h-7z" fill="white"/>') + '</svg>';
    return new TMap.MarkerStyle({ width: current ? 22 : size, height: current ? 22 : size,
      anchor: { x: (current ? 22 : size) / 2, y: (current ? 22 : size) / 2 },
      src: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) });
  }
  let ignoreBlankUntil = 0;
  function queueSelection(id) {
    if (!id && performance.now() < ignoreBlankUntil) return;
    // SDK marker/map click events may both fire, in either order. Coalesce that
    // event frame and prefer its marker. No polling or dependence on bubbling.
    if (pendingClick === undefined || id) pendingClick = id;
    if (clickFrame) return;
    clickFrame = requestAnimationFrame(() => {
      const selected = pendingClick;
      clickFrame = null; pendingClick = undefined;
      if (!selected && performance.now() < ignoreBlankUntil) return;
      if (bridge && scene) bridge.selectStation(selected);
    });
  }
  function initStations() {
    if (stationMarkers) return;
    // The native station page provides overview and nearby controls. Keep SDK attribution/scale.
    if (typeof map.removeControl === 'function' && TMap.constants && TMap.constants.DEFAULT_CONTROL_ID) {
      map.removeControl(TMap.constants.DEFAULT_CONTROL_ID.ZOOM);
      map.removeControl(TMap.constants.DEFAULT_CONTROL_ID.ROTATION);
    }
    stationMarkers = new TMap.MultiMarker({ map, geometries: [], styles: {
      available: stationStyle('#245c45'), full: stationStyle('#8b9d90'),
      selected: stationStyle('#388456', true), selectedFull: stationStyle('#8b9d90', true)
    }});
    locationMarker = new TMap.MultiMarker({ map, geometries: [],
      styles: { current: stationStyle('#2a8e8c', false, true) } });
    stationMarkers.on('click', event => { if (event.geometry) queueSelection(String(event.geometry.id)); });
    map.on('click', () => queueSelection(''));
  }
  function init() {
    if (state.ready) return true;
    if (!state.sdkReady || typeof TMap === 'undefined') return false;
    try {
      map = new TMap.Map(document.getElementById('map'), {
        center: new TMap.LatLng(41.79, 123.4), zoom: 12,
        minZoom: 3, maxZoom: 20, pitch: 0, rotation: 0, viewMode: '2D',
        draggable: true, scrollable: true, doubleClickZoom: true
      });
      map.on('tilesloaded', () => {
        if (state.tilesReady) return;
        // This is the SDK's visible-tile event, not HTML/SDK download completion.
        state.tilesReady = true;
        // A hidden WebEngine view can suspend animation frames even while its
        // SDK/tiles download. Forward the event immediately, not through rAF.
        if (bridge) bridge.tilesReady();
      });
      lines = new TMap.MultiPolyline({ map, geometries: [], styles: {
        route: new TMap.PolylineStyle({ color: '#245b48', width: 7, borderWidth: 2,
          borderColor: '#ffffff', lineCap: 'round' }),
        walking: new TMap.PolylineStyle({ color: '#6485b8', width: 5, borderWidth: 1,
          borderColor: '#ffffff', lineCap: 'round' })
      }});
      markers = new TMap.MultiMarker({ map, geometries: [],
        styles: { start: markerStyle('起', '#245b48'), end: markerStyle('终', '#b55242') } });
      state.ready = true;
      state.error = false;
      return true;
    } catch (_) { fail(); return false; }
  }
  function clear() {
    bounds = null;
    if (lines) lines.setGeometries([]);
    if (markers) markers.setGeometries([]);
    return true;
  }
  function setRoute(paths) {
    try {
      if ((!state.ready && !init()) || !paths.length) return false;
      scene = null;
      bounds = new TMap.LatLngBounds();
      const geometries = paths.map((leg, index) => {
        const points = leg.points.map(point => new TMap.LatLng(point[0], point[1]));
        points.forEach(point => bounds.extend(point));
        return { id: String(index), styleId: leg.walking ? 'walking' : 'route', paths: points };
      });
      lines.setGeometries(geometries);
      const first = geometries[0].paths[0];
      const lastLeg = geometries[geometries.length - 1].paths;
      markers.setGeometries([
        { id: 'start', styleId: 'start', position: first },
        { id: 'end', styleId: 'end', position: lastLeg[lastLeg.length - 1] }
      ]);
      return fit();
    } catch (_) { fail(); return false; }
  }
  function selectStation(id) {
    if (!scene || !stationMarkers) return false;
    scene.selected = id;
    stationMarkers.setGeometries(scene.stations.map(station => ({
      id: station.id,
      styleId: station.id === id ? (station.available > 0 ? 'selected' : 'selectedFull')
                                : station.available > 0 ? 'available' : 'full',
      position: new TMap.LatLng(station.lat, station.lng)
    })));
    return true;
  }
  function projected(point) {
    const latitude = Math.max(-85.05112878, Math.min(85.05112878, point.lat)) * Math.PI / 180;
    return { x: (point.lng + 180) / 360, y: (1 - Math.asinh(Math.tan(latitude)) / Math.PI) / 2 };
  }
  function unprojected(x, y) {
    return new TMap.LatLng(Math.atan(Math.sinh(Math.PI * (1 - 2 * y))) * 180 / Math.PI, x * 360 - 180);
  }
  function viewport() {
    const p = scene.padding || {};
    return { left: p.left || 24, top: p.top || 24,
      width: Math.max(80, innerWidth - (p.left || 24) - (p.right || 24)),
      height: Math.max(100, innerHeight - (p.top || 24) - (p.bottom || 24)) };
  }
  let stationFitFrame;
  function fitStations() {
    if (!state.ready || !scene) return false;
    autoFit = true;
    // First hidden preload must run without an animation frame. Thereafter
    // coalesce native layout/auth updates until Chromium's viewport is settled;
    // QStackedWidget can briefly deliver its old hidden-page size on show.
    if (!lastStationFit) return fitStationsNow();
    if (!stationFitFrame) stationFitFrame = requestAnimationFrame(() => {
      stationFitFrame = null;
      if (autoFit) fitStationsNow();
    });
    return true;
  }
  function fitStationsNow() {
    if (!state.ready || !scene) return false;
    autoFit = true;
    const points = (scene.defaultBounds || scene.stations.concat(scene.location ? [scene.location] : [])).map(projected);
    if (!points.length) return true;
    const area = viewport();
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const left = Math.min(...xs), right = Math.max(...xs), top = Math.min(...ys), bottom = Math.max(...ys);
    const scale = Math.min(area.width / Math.max(right - left, .000035),
                           area.height / Math.max(bottom - top, .000035)) * .90;
    const cx = (left + right) / 2 - (area.left + area.width / 2 - innerWidth / 2) / scale;
    const cy = (top + bottom) / 2 - (area.top + area.height / 2 - innerHeight / 2) / scale;
    const camera = {cx, cy, scale, width: innerWidth, height: innerHeight};
    if (lastStationFit && Math.abs(lastStationFit.cx-cx)*scale < .5
        && Math.abs(lastStationFit.cy-cy)*scale < .5 && Math.abs(lastStationFit.scale-scale) < .5
        && lastStationFit.width === innerWidth && lastStationFit.height === innerHeight) return true;
    lastStationFit = camera;
    // Extend the geographic bounds to account for native floating controls.
    // This uses the same numeric fitBounds padding as the route scene.
    const fitted = new TMap.LatLngBounds();
    fitted.extend(unprojected(cx - innerWidth / scale / 2, cy - innerHeight / scale / 2));
    fitted.extend(unprojected(cx + innerWidth / scale / 2, cy + innerHeight / scale / 2));
    // fitBounds defaults to a 500 ms ease. Repeated layout/authentication fits
    // must not animate through intermediate cameras and request extra tiles.
    map.fitBounds(fitted, { padding: 0, ease: { duration: 0 } });
    return true;
  }
  function setStationPadding(padding) {
    if (!scene) return false;
    scene.padding = padding;
    if (autoFit) fitStations();
    return true;
  }
  function setCenter(point) {
    if (!state.ready || !scene) return false;
    autoFit = false;
    lastStationFit = null;
    if (Number.isFinite(point.zoom)) map.setZoom(point.zoom);
    const area = viewport(), p = projected(point), scale = 256 * Math.pow(2, map.getZoom());
    map.setCenter(unprojected(p.x - (area.left + area.width / 2 - innerWidth / 2) / scale,
                              p.y - (area.top + area.height / 2 - innerHeight / 2) / scale));
    return true;
  }
  function setStations(data) {
    try {
      if (!state.ready && !init()) return false;
      initStations();
      scene = data;
      selectStation(data.selected);
      locationMarker.setGeometries(data.location ? [{ id: 'current', styleId: 'current',
        position: new TMap.LatLng(data.location.lat, data.location.lng) }] : []);
      return autoFit ? fitStations() : true;
    } catch (_) { fail(); return false; }
  }
  function zoom(delta) {
    if (!state.ready) return false;
    autoFit = false;
    lastStationFit = null;
    map.setZoom(Math.max(3, Math.min(20, map.getZoom() + delta)));
    return true;
  }
  function resume() {
    if (!state.ready || !map) return false;
    if (typeof map.resize === 'function') map.resize();
    if (autoFit) { if (scene) fitStations(); else if (bounds) fit(); }
    return true;
  }
  const mapElement = document.getElementById('map');
  const pointers = new Map();
  let pointerGesture = false;
  function userInteraction() {
    autoFit = false; lastStationFit = null;
    ignoreBlankUntil = performance.now() + 300;
    if (scene && bridge) bridge.interact();
  }
  mapElement.addEventListener('wheel', userInteraction, { passive: true, capture: true });
  mapElement.addEventListener('dblclick', userInteraction, { passive: true, capture: true });
  mapElement.addEventListener('pointerdown', event => {
    autoFit = false; lastStationFit = null;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size > 1) { pointerGesture = true; userInteraction(); }
  }, { passive: true, capture: true });
  window.addEventListener('pointermove', event => {
    const start = pointers.get(event.pointerId);
    if (!start) return;
    if (!pointerGesture && Math.hypot(event.clientX - start.x, event.clientY - start.y) > 6) {
      pointerGesture = true; userInteraction();
    }
    if (pointerGesture) ignoreBlankUntil = performance.now() + 300;
  }, { passive: true, capture: true });
  function endPointer(event) {
    if (pointerGesture) ignoreBlankUntil = performance.now() + 300;
    pointers.delete(event.pointerId);
    if (!pointers.size) pointerGesture = false;
  }
  window.addEventListener('pointerup', endPointer, { passive: true, capture: true });
  window.addEventListener('pointercancel', endPointer, { passive: true, capture: true });
  let resizeFrame;
  new ResizeObserver(() => {
    cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => {
      if (!state.ready) return;
      if (typeof map.resize === 'function') map.resize();
      if (autoFit) { if (scene) fitStations(); else if (bounds) fit(); }
    });
  }).observe(document.getElementById('map'));
  return { state, sdkLoaded, init, fail, setRoute, clear, zoom, fit, resume,
    setStations, selectStation, fitStations, setCenter, setStationPadding };
})();
</script>
<script src="__MAP_SCRIPT_URL__" onload="bitMap.sdkLoaded()" onerror="bitMap.fail()"></script>
</body>
</html>
